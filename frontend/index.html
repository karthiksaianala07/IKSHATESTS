<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKSHATESTS | Architecture for JEE & NEET Success</title>
    <meta name="description" content="A premium 2026 mock test platform mimicking NTA CBT for JEE and NEET with advanced analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script src="https://cdn.jsdelivr.net/npm/tracking@1.1.3/build/tracking-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tracking@1.1.3/build/data/face-min.js"></script>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color: #ef4444; padding: 24px; font-family: monospace; font-size: 14px; bg-color: #1e1b4b; background: #0f172a; border: 2px solid #ef4444; border-radius: 16px; margin: 40px auto; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left;">' +
            '<h3 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 900; color: #ef4444; border-b: 1px solid #ef4444/30; padding-bottom: 8px;">⚠️ UNHANDLED JAVASCRIPT EXCEPTION</h3>' +
            '<p style="margin: 8px 0; color: #cbd5e1;"><strong>Message:</strong> ' + e.message + '</p>' +
            '<p style="margin: 8px 0; color: #cbd5e1;"><strong>File:</strong> ' + e.filename + '</p>' +
            '<p style="margin: 8px 0; color: #cbd5e1;"><strong>Line/Col:</strong> ' + e.lineno + ':' + e.colno + '</p>' +
            '<p style="margin: 16px 0 0 0; color: #94a3b8; font-size: 12px; white-space: pre-wrap; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; overflow-x: auto;"><strong>Stack Trace:</strong>\n' + (e.error ? e.error.stack : 'N/A') + '</p>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color: #ef4444; padding: 24px; font-family: monospace; font-size: 14px; bg-color: #1e1b4b; background: #0f172a; border: 2px solid #ef4444; border-radius: 16px; margin: 40px auto; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left;">' +
            '<h3 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 900; color: #ef4444; border-b: 1px solid #ef4444/30; padding-bottom: 8px;">⚠️ UNHANDLED PROMISE REJECTION</h3>' +
            '<p style="margin: 8px 0; color: #cbd5e1;"><strong>Reason:</strong> ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown') + '</p>' +
            '<p style="margin: 16px 0 0 0; color: #94a3b8; font-size: 12px; white-space: pre-wrap; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; overflow-x: auto;"><strong>Stack Trace:</strong>\n' + (e.reason && e.reason.stack ? e.reason.stack : 'N/A') + '</p>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
